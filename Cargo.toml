[package]
name = "mcpg-control-plane-license"
version = "0.1.0-beta.13"
edition = "2024"
license = "Apache-2.0"
description = "License-token claims, offline verification, plan envelopes, and entitlement gates shared by the CP, the federation issuer, and the gateway."

[lib]

[dependencies]
# Errors + tracing
thiserror = "2"

# Serde (claims + ids)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Id generation + digests (ids.rs slug/hash newtypes)
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# Time + UUIDs
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

# Crypto: Ed25519 (license verification)
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }

# JWT (license tokens)
jsonwebtoken = { version = "10.4", default-features = false, features = ["aws_lc_rs"] }

# Glob (plugin entitlement matching)
globset = "0.4"

